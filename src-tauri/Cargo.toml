[package]
name = "mintcare-companion"
version = "1.0.0"
description = "MintCare Companion System Cleanup and Diagnostics"
authors = ["Linux Mint Community"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs-next = "2.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
